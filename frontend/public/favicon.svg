<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sol" x1="40" y1="40" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset=".10" stop-color="#E0D9FF"/><stop offset=".45" stop-color="#C159EC"/><stop offset="1" stop-color="#C427FB"/>
    </linearGradient>
    <linearGradient id="calida" x1="60" y1="60" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E0D9FF"/><stop offset=".28" stop-color="#AEC9FF"/><stop offset=".54" stop-color="#7758D1"/><stop offset=".80" stop-color="#5936B4"/><stop offset="1" stop-color="#48319D"/>
    </linearGradient>
    <linearGradient id="azul" x1="150" y1="150" x2="280" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset=".10" stop-color="#AEC9FF"/><stop offset=".42" stop-color="#427BD1"/><stop offset=".75" stop-color="#48319D"/><stop offset="1" stop-color="#312B5B"/>
    </linearGradient>

    <g id="atras">
      <circle cx="178.5" cy="127.8" r="59.9"/><circle cx="230.6" cy="167.3" r="56.7"/>
      <rect x="130" y="150" width="140" height="74" rx="38"/>
    </g>
    <g id="principal">
      <circle cx="37" cy="171.9" r="35.8"/><circle cx="92.6" cy="158.8" r="43.3"/>
      <circle cx="167.5" cy="125.3" r="51.9"/>
      <rect x="1" y="150" width="218" height="75" rx="36"/>
    </g>
    <g id="frente">
      <circle cx="220.6" cy="174.5" r="41.5"/><circle cx="175.2" cy="196.5" r="28.4"/>
      <rect x="150" y="188" width="86" height="37" rx="32"/>
    </g>

    <mask id="corte" maskUnits="userSpaceOnUse" x="0" y="0" width="289" height="226">
      <rect width="289" height="226" fill="#FFF"/>
      <g fill="#000" stroke="#000" stroke-width="27" stroke-linejoin="round">
        <use href="#atras"/><use href="#principal"/>
      </g>
    </mask>
  </defs>

  <!-- El cuadrado da un fondo controlado: la pestana puede ser clara u oscura. -->
  <rect width="64" height="64" rx="13" fill="#1C1B33"/>
  <g transform="translate(4 9) scale(0.1938)">
    <circle cx="139.8" cy="102.9" r="101.6" fill="url(#sol)" mask="url(#corte)"/>
    <use href="#atras" fill="#E0D9FF"/>
    <use href="#principal" fill="url(#calida)"/>
    <use href="#frente" fill="url(#azul)"/>
  </g>
</svg>
